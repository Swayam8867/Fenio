<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Fenio Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1>Fenio admin</h1><p>Private. Only you can add or remove products.</p></header>
<main>
  <section id="login" class="panel">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p><button class="btn" id="loginBtn">Log in</button></p>
    <div class="msg err" id="loginMsg"></div>
  </section>

  <div id="dash" hidden>
    <form id="form" class="panel">
      <h2>Add a product</h2>
      <label for="image">Product image</label>
      <input id="image" type="file" accept="image/*" required>
      <label for="name">Product name</label>
      <input id="name" required maxlength="120">
      <label for="price">Price (optional)</label>
      <input id="price" maxlength="30">
      <label for="category">Category (optional)</label>
      <input id="category" maxlength="30">
      <label for="description">Description</label>
      <textarea id="description" rows="4" maxlength="600"></textarea>
      <label for="link">Digistore24 promolink or product ID</label>
      <input id="link" placeholder="https://www.digistore24.com/redir/123456/youraffid/" required>
      <p><button class="btn" type="submit" id="submitBtn">Publish product</button></p>
      <div class="msg" id="msg"></div>
    </form>
    <h2>Your products</h2>
    <div id="list"></div>
    <p><button class="btn ghost" id="logout">Log out</button></p>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
let pw = sessionStorage.getItem('pw');

async function api(body){
  const r = await fetch('/.netlify/functions/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw, ...body }) });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(d.error || 'Request failed'); e.status = r.status; throw e; }
  return d;
}
function show(){ $('login').hidden = !!pw; $('dash').hidden = !pw; if (pw) load(); }
function logout(){ pw = null; sessionStorage.removeItem('pw'); show(); }

async function login(){
  pw = $('pw').value; $('loginMsg').textContent = '';
  try { await api({ action:'login' }); sessionStorage.setItem('pw', pw); show(); }
  catch(e){ pw = null; $('loginMsg').textContent = e.message; }
}
$('loginBtn').onclick = login;
$('pw').addEventListener('keydown', e => e.key === 'Enter' && login());
$('logout').onclick = logout;

async function load(){
  try {
    const { products } = await api({ action:'list' });
    $('list').innerHTML = products.length ? products.map(p => `
      <div class="row"><img src="${esc(p.image)}" alt=""><span>${esc(p.name)}</span>
      <button class="btn ghost" data-id="${esc(p.id)}">Delete</button></div>`).join('') : '<p class="empty">Nothing published yet.</p>';
  } catch(e){ if (e.status === 401) logout(); else $('list').textContent = e.message; }
}
$('list').addEventListener('click', async (e) => {
  const id = e.target.dataset.id;
  if (!id || !confirm('Delete this product?')) return;
  e.target.disabled = true;
  try { await api({ action:'delete', id }); } catch(err){ alert(err.message); }
  load();
});

// shrink the photo so uploads are fast and small
function resize(file){
  return new Promise((res, rej) => {
    if (file.type === 'image/gif') { const fr = new FileReader(); fr.onload = () => res({ b64: fr.result.split(',')[1], type: 'image/gif' }); fr.onerror = rej; fr.readAsDataURL(file); return; }
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res({ b64: c.toDataURL('image/jpeg', 0.85).split(',')[1], type: 'image/jpeg' });
    };
    img.onerror = () => rej(new Error('Could not read that image.'));
    img.src = url;
  });
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('msg'), btn = $('submitBtn'); msg.className = 'msg'; msg.textContent = 'Publishing…'; btn.disabled = true;
  try {
    const img = await resize($('image').files[0]);
    await api({ action:'add', product:{ name:$('name').value, price:$('price').value, category:$('category').value, description:$('description').value, link:$('link').value, imageBase64:img.b64, imageType:img.type } });
    msg.className = 'msg ok'; msg.textContent = 'Published. Your store will show it in 1 to 2 minutes.';
    e.target.reset(); load();
  } catch(err){ if (err.status === 401) { logout(); return; } msg.className = 'msg err'; msg.textContent = err.message; }
  btn.disabled = false;
});
show();
</script>
</body>
</html>
